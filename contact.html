<main>
  <section class="contact-section" id="contact">
    <div class="contact-inner">
      <p class="eyebrow">CONTACT 2026</p>
      <h1 class="hero-title" style="font-size:clamp(2.4rem,5vw,4rem);margin-bottom:1rem;">
        <span class="line">聯絡</span>
        <span class="line line-em">讓想法從這裡開始。</span>
      </h1>
      <p class="section-desc">委託創作、合作邀約或單純想交流作品，都可以從這一頁聯絡我。</p>

      <form class="contact-form" id="contactForm" novalidate>
        <div class="form-row">
          <label for="name">姓名</label>
          <input type="text" id="name" name="name" required placeholder="怎麼稱呼你">
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-row">
          <label for="subject">主旨</label>
          <select id="subject" name="subject">
            <option value="commission">委託創作</option>
            <option value="exhibition">展覽 / 合作邀約</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-row">
          <label for="message">訊息內容</label>
          <textarea id="message" name="message" rows="7" required placeholder="想聊聊什麼呢？"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-wide">送出訊息</button>
        <p class="form-note" id="formNote" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
