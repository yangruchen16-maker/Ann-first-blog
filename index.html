<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陳泱儒 作業部落格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<style>
  :root{
    --bg:#0A0D14;
    --bg-deep:#05070B;
    --surface:#111624;
    --surface-2:#171E30;
    --border:rgba(148,163,196,0.14);
    --border-bright:rgba(148,163,196,0.28);
    --text:#E7EAF2;
    --text-soft:#8A93A8;
    --text-faint:#5B6478;
    --cyan:#4FE3D0;
    --violet:#9B7BFF;
    --grad: linear-gradient(120deg, var(--cyan), var(--violet));
    --amber:#FFB454;
    --danger:#FF6B7A;
    --mono: "JetBrains Mono", monospace;
    --sans: "Noto Sans TC", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 12% -10%, rgba(155,123,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(79,227,208,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--violet); color:#0A0D14; }
  a{ color:inherit; }

  /* ---------- Hero / terminal window ---------- */
  header.cover{
    padding:56px 20px 40px;
  }
  .term{
    max-width:900px;
    margin:0 auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,0.45);
  }
  .term-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#FF5F57; }
  .dot.y{ background:#FEBC2E; }
  .dot.g{ background:#28C840; }
  .term-path{
    margin-left:14px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-soft);
  }
  .term-body{
    padding:34px 34px 30px;
    position:relative;
  }
  .term-body .prompt{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--cyan);
    letter-spacing:0.06em;
    margin-bottom:14px;
  }
  .term-body .prompt::before{ content:"❯ "; color:var(--violet); }
  .term-body h1{
    font-family:var(--sans);
    font-weight:900;
    font-size:clamp(30px,4.6vw,42px);
    margin:0 0 12px;
    background:var(--grad);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:0.01em;
  }
  .term-body p.sub{
    font-size:14.5px;
    color:var(--text-soft);
    line-height:1.8;
    max-width:560px;
    margin:0;
  }
  .cursor-blink{
    display:inline-block;
    width:8px; height:1em;
    background:var(--cyan);
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* stat row inside terminal */
  .stat-row{
    display:flex;
    gap:10px;
    margin-top:26px;
    flex-wrap:wrap;
  }
  .stat{
    flex:1 1 120px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
  }
  .stat .n{
    font-family:var(--mono);
    font-weight:700;
    font-size:22px;
    color:var(--text);
  }
  .stat .l{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-top:4px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:900px;
    margin:26px auto 0;
    padding:0 20px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
  }
  .filters{
    display:flex; gap:6px; flex-wrap:wrap;
    background:var(--surface);
    border:1px solid var(--border);
    padding:6px;
    border-radius:10px;
  }
  .filter-btn{
    border:1px solid transparent;
    background:transparent;
    color:var(--text-soft);
    font-family:var(--mono);
    font-size:12px;
    padding:8px 13px;
    border-radius:7px;
    cursor:pointer;
    transition:all .15s ease;
    letter-spacing:0.02em;
  }
  .filter-btn:hover{ color:var(--text); }
  .filter-btn.active{
    background:var(--grad);
    color:#0A0D14;
    font-weight:700;
  }
  .new-post-btn{
    background:var(--grad);
    color:#0A0D14;
    border:none;
    padding:13px 22px;
    border-radius:9px;
    font-family:var(--mono);
    font-weight:700;
    font-size:13.5px;
    letter-spacing:0.03em;
    cursor:pointer;
    box-shadow:0 12px 26px rgba(79,227,208,0.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .new-post-btn:hover{ transform:translateY(-2px); box-shadow:0 16px 32px rgba(155,123,255,0.28); }
  .new-post-btn:focus-visible, .filter-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--cyan); outline-offset:2px;
  }

  /* ---------- Post grid (file cards) ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:36px 20px 100px;
  }
  #loading, #empty{
    text-align:center;
    color:var(--text-soft);
    padding:80px 20px;
    font-size:13.5px;
    font-family:var(--mono);
  }
  #empty .big{
    font-family:var(--sans);
    font-weight:900;
    font-size:20px;
    color:var(--text);
    margin-bottom:10px;
    display:block;
  }
  .posts-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:18px;
  }
  .post-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:0 0 18px;
    cursor:pointer;
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .post-card:hover{
    transform:translateY(-4px);
    border-color:var(--border-bright);
    box-shadow:0 18px 40px rgba(0,0,0,0.4);
  }
  .post-card .file-bar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 14px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-faint);
  }
  .post-card .file-bar .dot{ width:7px; height:7px; }
  .post-card .file-bar .ext{ margin-left:auto; }
  .post-card .body{ padding:18px 18px 0; }
  .post-card .cat{
    display:inline-block;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.05em;
    color:var(--violet);
    background:rgba(155,123,255,0.10);
    border:1px solid rgba(155,123,255,0.35);
    padding:3px 9px;
    border-radius:5px;
    margin-bottom:12px;
  }
  .post-card h3{
    font-family:var(--sans);
    font-weight:700;
    font-size:17.5px;
    margin:0 0 10px;
    line-height:1.5;
  }
  .post-card .excerpt{
    font-size:12.5px;
    color:var(--text-soft);
    line-height:1.8;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    margin-bottom:16px;
  }
  .post-card .meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    font-family:var(--mono);
    color:var(--text-faint);
    border-top:1px dashed var(--border);
    padding:12px 18px 0;
    margin:0 -18px;
    padding-left:18px;
    padding-right:18px;
  }
  .post-card .del-btn{
    background:none;
    border:none;
    color:var(--text-faint);
    cursor:pointer;
    font-family:var(--mono);
    font-size:11px;
    text-decoration:underline;
    padding:0;
  }
  .post-card .del-btn:hover{ color:var(--danger); }

  /* ---------- Modal shared ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(5,7,11,0.72);
    backdrop-filter:blur(3px);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--surface);
    border:1px solid var(--border-bright);
    max-width:640px;
    width:100%;
    border-radius:12px;
    box-shadow:0 40px 90px rgba(0,0,0,0.55);
    padding:30px 28px 26px;
    position:relative;
  }
  .modal-close{
    position:absolute; top:14px; right:14px;
    background:none; border:none;
    font-size:18px;
    cursor:pointer;
    color:var(--text-faint);
    line-height:1;
    padding:6px;
    font-family:var(--mono);
  }
  .modal-close:hover{ color:var(--danger); }
  .modal h2{
    font-family:var(--sans);
    font-weight:900;
    font-size:22px;
    margin:0 0 22px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:7px;
  }
  .field input[type=text], .field select, .field textarea{
    width:100%;
    font-family:var(--sans);
    font-size:14.5px;
    padding:11px 12px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
  }
  .field input[type=text]:focus, .field select:focus, .field textarea:focus{
    border-color:var(--cyan);
  }
  .field textarea{
    min-height:220px;
    resize:vertical;
    line-height:1.9;
    font-size:15px;
  }
  .file-drop{
    border:1.5px dashed var(--border-bright);
    border-radius:8px;
    padding:16px;
    text-align:center;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-soft);
    cursor:pointer;
    margin-bottom:16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .file-drop:hover{ border-color:var(--cyan); background:rgba(79,227,208,0.05); }
  .file-drop strong{ color:var(--cyan); }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:8px;
  }
  .btn-secondary{
    background:none;
    border:1px solid var(--border-bright);
    color:var(--text);
    padding:11px 18px;
    border-radius:8px;
    font-family:var(--mono);
    font-size:13px;
    cursor:pointer;
  }
  .btn-secondary:hover{ border-color:var(--danger); color:var(--danger); }
  .btn-primary{
    background:var(--grad);
    color:#0A0D14;
    border:none;
    padding:11px 22px;
    border-radius:8px;
    font-family:var(--mono);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .error-msg{
    color:var(--danger);
    font-family:var(--mono);
    font-size:12px;
    margin-top:-8px;
    margin-bottom:14px;
    display:none;
  }

  /* ---------- Read modal (code editor) ---------- */
  .read-modal{ max-width:780px; padding:0; overflow:hidden; }
  .read-head{
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
    padding:0;
  }
  .read-head .term-bar{ border-bottom:none; }
  .read-head-inner{
    padding:20px 26px 20px;
  }
  .read-head .cat{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.05em;
    color:var(--violet);
    background:rgba(155,123,255,0.10);
    border:1px solid rgba(155,123,255,0.35);
    padding:3px 9px;
    border-radius:5px;
    display:inline-block;
    margin-bottom:12px;
  }
  .read-head h2{
    font-family:var(--sans);
    font-weight:900;
    font-size:23px;
    margin:0 0 10px;
  }
  .read-head .meta{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-faint);
    display:flex;
    gap:16px;
  }
  .read-body-wrap{
    max-height:56vh;
    overflow-y:auto;
    background:var(--bg-deep);
  }
  .read-body{
    display:flex;
  }
  .line-numbers{
    flex:0 0 auto;
    padding:28px 14px 40px 20px;
    text-align:right;
    font-family:var(--mono);
    font-size:13px;
    line-height:26px;
    color:var(--text-faint);
    user-select:none;
    border-right:1px solid var(--border);
  }
  .read-text{
    flex:1 1 auto;
    padding:28px 26px 40px 22px;
    font-family:var(--sans);
    font-size:15.5px;
    line-height:26px;
    white-space:pre-wrap;
    color:var(--text);
  }
  .read-foot{
    display:flex;
    justify-content:flex-end;
    padding:14px 26px;
    background:var(--surface-2);
    border-top:1px solid var(--border);
  }

  footer{
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    padding:30px 20px 46px;
  }

  @media (max-width:520px){
    .toolbar{ flex-direction:column; align-items:stretch; }
    .filters{ justify-content:center; }
    .new-post-btn{ width:100%; }
    .stat-row{ gap:8px; }
    .line-numbers{ padding-left:10px; padding-right:8px; font-size:11.5px; }
    .read-text{ padding-left:14px; font-size:14.5px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<header class="cover">
  <div class="term">
    <div class="term-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="term-path">~/chen-yung-ju/blog</span>
    </div>
    <div class="term-body">
      <div class="prompt">whoami</div>
      <h1>陳泱儒 作業部落格</h1>
      <p class="sub">個人寫作歸檔系統。上傳文字檔或直接輸入內容，每一篇作文都會被存成一份檔案，隨時可以叫出來閱讀。<span class="cursor-blink"></span></p>
      <div class="stat-row" id="statRow">
        <div class="stat"><div class="n" id="statCount">0</div><div class="l">files</div></div>
        <div class="stat"><div class="n" id="statWords">0</div><div class="l">total chars</div></div>
        <div class="stat"><div class="n" id="statCats">0</div><div class="l">categories</div></div>
      </div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">全部</button>
  </div>
  <button class="new-post-btn" id="openNew">+ new_post.txt</button>
</div>

<main>
  <div id="loading">$ loading archive…</div>
  <div id="empty" style="display:none;">
    <span class="big">目前沒有任何檔案</span>
    點擊「+ new_post.txt」，建立第一篇作業存檔。
  </div>
  <div class="posts-grid" id="grid" style="display:none;"></div>
</main>

<footer>// 僅供陳泱儒個人作業存檔使用 · 資料保存於此裝置的個人儲存空間</footer>

<!-- New Post Modal -->
<div class="overlay" id="newOverlay">
  <div class="modal">
    <button class="modal-close" id="closeNew" aria-label="關閉">✕</button>
    <h2>新增文章</h2>

    <div class="field">
      <label for="titleInput">標題</label>
      <input type="text" id="titleInput" placeholder="例如：夏日的午後">
    </div>

    <div class="field">
      <label for="catInput">文章類型</label>
      <select id="catInput">
        <option>記敘文</option>
        <option>抒情文</option>
        <option>議論文</option>
        <option>說明文</option>
        <option>讀書心得</option>
        <option>其他</option>
      </select>
    </div>

    <div class="file-drop" id="fileDrop">
      上傳檔案（.txt／.docx／.pdf）自動帶入內容，或直接在下方欄位輸入／貼上文章。<br>
      <strong id="fileName">點此選擇檔案</strong>
      <input type="file" id="fileInput" accept=".txt,.docx,.pdf,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none;">
    </div>

    <div class="field">
      <label for="contentInput">內容</label>
      <textarea id="contentInput" placeholder="在這裡輸入或貼上文章內容…"></textarea>
    </div>

    <div class="error-msg" id="formError">請填寫標題與內容後再發表。</div>

    <div class="modal-actions">
      <button class="btn-secondary" id="cancelNew">取消</button>
      <button class="btn-primary" id="submitNew">發表文章</button>
    </div>
  </div>
</div>

<!-- Read Modal -->
<div class="overlay" id="readOverlay">
  <div class="modal read-modal">
    <button class="modal-close" id="closeRead" aria-label="關閉">✕</button>
    <div class="read-head">
      <div class="term-bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="term-path" id="readFileName"></span>
      </div>
      <div class="read-head-inner">
        <div class="cat" id="readCat"></div>
        <h2 id="readTitle"></h2>
        <div class="meta">
          <span id="readDate"></span>
          <span id="readCount"></span>
        </div>
      </div>
    </div>
    <div class="read-body-wrap">
      <div class="read-body">
        <div class="line-numbers" id="readLines"></div>
        <div class="read-text" id="readBody"></div>
      </div>
    </div>
    <div class="read-foot">
      <button class="btn-secondary" id="deleteFromRead">刪除這篇文章</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'chen-essays-posts';
  const CATS = ['記敘文','抒情文','議論文','說明文','讀書心得','其他'];
  let posts = [];
  let activeFilter = 'all';

  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
  }

  const $ = (id) => document.getElementById(id);
  const grid = $('grid'), loadingEl = $('loading'), emptyEl = $('empty');
  const filtersEl = $('filters');

  CATS.forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    filtersEl.appendChild(btn);
  });
  filtersEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    activeFilter = btn.dataset.cat;
    [...filtersEl.querySelectorAll('.filter-btn')].forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });

  function countChars(text){ return text.replace(/\s/g,'').length; }
  function formatDate(iso){
    const d = new Date(iso);
    return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
  }
  function excerpt(text){
    const clean = text.replace(/\s+/g,' ').trim();
    return clean.length > 70 ? clean.slice(0,70)+'…' : clean;
  }
  function slug(title){
    return title.replace(/\s+/g,'_').replace(/[^\w\u4e00-\u9fa5_-]/g,'').slice(0,24) || 'untitled';
  }

  async function loadPosts(){
    loadingEl.style.display='block';
    grid.style.display='none';
    emptyEl.style.display='none';
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      posts = result && result.value ? JSON.parse(result.value) : [];
    }catch(err){
      posts = [];
    }
    loadingEl.style.display='none';
    render();
  }

  async function savePosts(){
    try{
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(posts), false);
      if(!result){ console.error('儲存失敗'); }
    }catch(err){
      console.error('Storage error:', err);
    }
  }

  function updateStats(){
    $('statCount').textContent = posts.length;
    $('statWords').textContent = posts.reduce((sum,p)=>sum+countChars(p.content),0);
    $('statCats').textContent = new Set(posts.map(p=>p.cat)).size;
  }

  function render(){
    updateStats();
    const filtered = activeFilter === 'all' ? posts : posts.filter(p=>p.cat === activeFilter);
    const sorted = [...filtered].sort((a,b)=> new Date(b.date) - new Date(a.date));

    if(posts.length === 0){
      grid.style.display='none';
      emptyEl.style.display='block';
      return;
    }
    emptyEl.style.display='none';
    grid.style.display='grid';
    grid.innerHTML = '';

    if(sorted.length === 0){
      const div = document.createElement('div');
      div.style.cssText = 'grid-column:1/-1;text-align:center;color:var(--text-faint);padding:40px;font-family:var(--mono);font-size:13px;';
      div.textContent = '這個分類目前還沒有文章。';
      grid.appendChild(div);
      return;
    }

    sorted.forEach(post=>{
      const card = document.createElement('div');
      card.className = 'post-card';
      card.innerHTML = `
        <div class="file-bar">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="ext">.txt</span>
        </div>
        <div class="body">
          <span class="cat">${post.cat}</span>
          <h3>${escapeHTML(post.title)}</h3>
          <div class="excerpt">${escapeHTML(excerpt(post.content))}</div>
        </div>
        <div class="meta">
          <span>${formatDate(post.date)} · ${countChars(post.content)} 字</span>
          <button class="del-btn" data-id="${post.id}">刪除</button>
        </div>
      `;
      card.addEventListener('click', (e)=>{
        if(e.target.closest('.del-btn')) return;
        openRead(post.id);
      });
      card.querySelector('.del-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        deletePost(post.id);
      });
      grid.appendChild(card);
    });
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- New post modal ----
  const newOverlay = $('newOverlay');
  const titleInput = $('titleInput'), catInput = $('catInput'), contentInput = $('contentInput');
  const fileInput = $('fileInput'), fileDrop = $('fileDrop'), fileNameEl = $('fileName');
  const formError = $('formError');

  function openNewModal(){
    titleInput.value = '';
    catInput.value = CATS[0];
    contentInput.value = '';
    fileNameEl.textContent = '點此選擇檔案';
    formError.style.display = 'none';
    newOverlay.classList.add('open');
    setTimeout(()=>titleInput.focus(), 50);
  }
  function closeNewModal(){ newOverlay.classList.remove('open'); }

  $('openNew').addEventListener('click', openNewModal);
  $('closeNew').addEventListener('click', closeNewModal);
  $('cancelNew').addEventListener('click', closeNewModal);
  newOverlay.addEventListener('click', (e)=>{ if(e.target === newOverlay) closeNewModal(); });

  fileDrop.addEventListener('click', ()=> fileInput.click());

  function fillTitleFromFile(file){
    if(!titleInput.value){
      titleInput.value = file.name.replace(/\.[^/.]+$/, '');
    }
  }

  async function extractDocx(file){
    const buffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buffer });
    return result.value;
  }

  async function extractPdf(file){
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let text = '';
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      text += (i > 1 ? '\n\n' : '') + pageText;
    }
    return text;
  }

  function extractTxt(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=> resolve(e.target.result);
      reader.onerror = ()=> reject(new Error('讀取失敗'));
      reader.readAsText(file, 'UTF-8');
    });
  }

  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    fileNameEl.textContent = '讀取中…' + file.name;

    try{
      let text;
      if(ext === 'docx'){
        text = await extractDocx(file);
      }else if(ext === 'pdf'){
        text = await extractPdf(file);
      }else if(ext === 'txt'){
        text = await extractTxt(file);
      }else{
        fileNameEl.textContent = '不支援的檔案格式，請改用 .txt、.docx 或 .pdf。';
        return;
      }
      contentInput.value = text.trim();
      fillTitleFromFile(file);
      fileNameEl.textContent = '已選擇：' + file.name;
    }catch(err){
      console.error('File extract error:', err);
      fileNameEl.textContent = '讀取「' + file.name + '」失敗，請改用貼上文字的方式。';
    }
  });

  $('submitNew').addEventListener('click', async ()=>{
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();
    if(!title || !content){
      formError.style.display = 'block';
      return;
    }
    formError.style.display = 'none';

    const submitBtn = $('submitNew');
    submitBtn.disabled = true;
    submitBtn.textContent = '發表中…';

    const post = {
      id: 'post_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      title,
      cat: catInput.value,
      content,
      date: new Date().toISOString()
    };
    posts.push(post);
    await savePosts();

    submitBtn.disabled = false;
    submitBtn.textContent = '發表文章';
    closeNewModal();
    render();
  });

  // ---- Delete ----
  async function deletePost(id){
    if(!confirm('確定要刪除這篇文章嗎？此動作無法復原。')) return;
    posts = posts.filter(p=>p.id !== id);
    await savePosts();
    readOverlay.classList.remove('open');
    render();
  }

  // ---- Read modal ----
  const readOverlay = $('readOverlay');
  let currentReadId = null;

  function openRead(id){
    const post = posts.find(p=>p.id === id);
    if(!post) return;
    currentReadId = id;
    $('readFileName').textContent = '~/chen-yung-ju/blog/' + slug(post.title) + '.txt';
    $('readCat').textContent = post.cat;
    $('readTitle').textContent = post.title;
    $('readDate').textContent = formatDate(post.date);
    $('readCount').textContent = countChars(post.content) + ' 字';
    $('readBody').textContent = post.content;

    const lineCount = Math.max(post.content.split('\n').length, 1);
    const lines = [];
    for(let i=1;i<=lineCount;i++) lines.push(i);
    $('readLines').innerHTML = lines.join('<br>');

    readOverlay.classList.add('open');
  }
  $('closeRead').addEventListener('click', ()=> readOverlay.classList.remove('open'));
  readOverlay.addEventListener('click', (e)=>{ if(e.target === readOverlay) readOverlay.classList.remove('open'); });
  $('deleteFromRead').addEventListener('click', ()=>{ if(currentReadId) deletePost(currentReadId); });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      newOverlay.classList.remove('open');
      readOverlay.classList.remove('open');
    }
  });

  loadPosts();
})();
</script>

</body>
</html>
