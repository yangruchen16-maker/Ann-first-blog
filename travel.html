<style>
  .travel-section{
    position:relative;
    z-index:2;
    max-width:1320px;
    margin:0 auto;
    padding:clamp(5rem,9vw,8rem) clamp(1rem,2.5vw,2rem) 7rem;
  }
  .travel-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:clamp(1.4rem,3vw,2.5rem);
    margin-top:3rem;
  }
  .travel-card{
    overflow:hidden;
    border:1px solid rgba(255,249,243,.14);
    background:rgba(255,249,243,.035);
    border-radius:4px;
    cursor:pointer;
    transition:transform .25s ease,border-color .25s ease,background .25s ease;
  }
  .travel-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    background:rgba(255,249,243,.06);
  }
  .travel-cover{
    aspect-ratio:16/10;
    overflow:hidden;
    background:rgba(255,249,243,.05);
  }
  .travel-cover img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
  }
  .travel-card-body{ padding:1.5rem 1.5rem 1.7rem; }
  .travel-meta{
    margin:0 0 .7rem;
    color:var(--accent);
    font-size:.78rem;
    letter-spacing:.12em;
  }
  .travel-title{
    margin:0 0 .8rem;
    color:var(--text-hi);
    font-size:clamp(1.35rem,2vw,1.8rem);
    font-weight:500;
  }
  .travel-excerpt{
    margin:0;
    color:var(--text-lo);
    font-size:1rem;
    line-height:1.85;
  }
  .travel-empty{
    grid-column:1/-1;
    padding:clamp(3rem,8vw,6rem) 1.5rem;
    border-top:1px solid rgba(255,249,243,.16);
    border-bottom:1px solid rgba(255,249,243,.16);
    text-align:left;
  }
  .travel-empty strong{
    display:block;
    color:var(--text-hi);
    font-size:clamp(1.5rem,3vw,2.3rem);
    font-weight:500;
    margin-bottom:1rem;
  }
  .travel-empty p{
    max-width:650px;
    color:var(--text-lo);
    line-height:1.9;
  }
  .travel-modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:1rem;
  }
  .travel-modal.is-open{ display:flex; }
  .travel-modal-backdrop{
    position:absolute;
    inset:0;
    background:rgba(15,10,8,.88);
    backdrop-filter:blur(8px);
  }
  .travel-modal-panel{
    position:relative;
    z-index:1;
    width:min(1050px,96vw);
    max-height:90vh;
    overflow:auto;
    background:var(--ink-2);
    border:1px solid rgba(255,249,243,.16);
    border-radius:4px;
    padding:clamp(1.2rem,3vw,2rem);
  }
  .travel-modal-close{
    position:absolute;
    right:1rem;
    top:1rem;
    width:42px;
    height:42px;
    border:1px solid rgba(255,249,243,.18);
    background:var(--ink-2);
    color:var(--text-hi);
    cursor:pointer;
  }
  .travel-photo-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:.8rem;
    margin:1.6rem 0 2rem;
  }
  .travel-photo-grid img{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:3px;
  }
  .travel-modal-copy{ max-width:780px; }
  .travel-modal-copy h2{ color:var(--text-hi);font-size:clamp(1.7rem,3vw,2.5rem);margin:.5rem 0 1rem; }
  .travel-modal-copy p{ color:var(--text-lo);font-size:1.05rem;line-height:2;text-align:justify; }
  @media(max-width:720px){
    .travel-grid{ grid-template-columns:1fr; }
    .travel-photo-grid{ grid-template-columns:1fr; }
  }
</style>

<main class="travel-section">
  <div class="section-head">
    <p class="eyebrow">TRAVEL JOURNAL</p>
    <h1 class="hero-title" style="font-size:clamp(2.4rem,5vw,4rem);margin-bottom:1rem;">
      <span class="line">出國旅行</span>
      <span class="line line-em">把路上的感受留在這裡。</span>
    </h1>
    <p class="section-desc">每一次旅行都可以放入日期、地點、個人心得與多張照片。點開旅行卡片後，可以閱讀完整文字與照片紀錄。</p>

  </div>
  <div class="footer-contact"></div>
</footer>

<div class="travel-modal" id="travelModal" aria-hidden="true">
  <div class="travel-modal-backdrop" data-travel-close></div>
  <article class="travel-modal-panel" role="dialog" aria-modal="true" aria-labelledby="travelModalTitle">
    <button class="travel-modal-close" data-travel-close aria-label="關閉">✕</button>
    <div class="travel-modal-copy">
      <p class="travel-meta" id="travelModalMeta"></p>
      <h2 id="travelModalTitle"></h2>
      <div class="travel-photo-grid" id="travelModalPhotos"></div>
      <p id="travelModalReflection"></p>
    </div>
  </article>
</div>

<script>
  /*
    新增旅行時，只要在 TRIPS 陣列加入一筆資料即可。
    photos 可以放一張或多張圖片。
    範例：
    {
      id: 1,
      location: "城市，國家",
      date: "2026.08",
      title: "旅行標題",
      excerpt: "卡片上的短心得",
      reflection: "點開後看到的完整心得",
      photos: ["assets/travel/photo-01.jpg", "assets/travel/photo-02.jpg"]
    }
  */
  const TRIPS = [];

  const travelGrid = document.getElementById("travelGrid");
  const travelModal = document.getElementById("travelModal");

  function renderTrips(){
    if(!TRIPS.length){
      travelGrid.innerHTML = `
        <div class="travel-empty">
          <strong>下一段旅程，從這裡開始。</strong>
          <p>目前旅行頁的版型已完成。之後只要加入旅行心得和照片，就會自動變成旅行卡片，點開後可以看到完整文章與照片集。</p>
        </div>`;
      return;
    }

    travelGrid.innerHTML = TRIPS.map(trip => `
      <article class="travel-card" tabindex="0" role="button" data-trip-id="${trip.id}" aria-label="閱讀旅行紀錄：${trip.title}">
        <div class="travel-cover">
          ${trip.photos?.[0] ? `<img src="${trip.photos[0]}" alt="${trip.title}">` : ""}
        </div>
        <div class="travel-card-body">
          <p class="travel-meta">${trip.location} ／ ${trip.date}</p>
          <h2 class="travel-title">${trip.title}</h2>
          <p class="travel-excerpt">${trip.excerpt}</p>
        </div>
      </article>`).join("");

    document.querySelectorAll(".travel-card").forEach(card => {
      const open = () => openTrip(Number(card.dataset.tripId));
      card.addEventListener("click", open);
      card.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          open();
        }
      });
    });
  }

  function openTrip(id){
    const trip = TRIPS.find(item => item.id === id);
    if(!trip) return;
    document.getElementById("travelModalMeta").textContent = `${trip.location} ／ ${trip.date}`;
    document.getElementById("travelModalTitle").textContent = trip.title;
    document.getElementById("travelModalReflection").textContent = trip.reflection;
    document.getElementById("travelModalPhotos").innerHTML = (trip.photos || []).map((src,index) =>
      `<img src="${src}" alt="${trip.title} 照片 ${index + 1}">`
    ).join("");
    travelModal.classList.add("is-open");
    travelModal.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  }

  function closeTrip(){
    travelModal.classList.remove("is-open");
    travelModal.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }

  travelModal.querySelectorAll("[data-travel-close]").forEach(el => el.addEventListener("click", closeTrip));
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && travelModal.classList.contains("is-open")) closeTrip();
  });

  renderTrips();
</script>
<script src="script.js"></script>
</body>
