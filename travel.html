        <p class="travel-excerpt">從清邁乾熱的氣候出發，延伸到辣味飲食、市場物價、寺廟文化與亞洲大象。旅程最後，我也在象夫與大象長久陪伴的關係裡，思考一生只做一件事究竟是選擇、責任，還是環境的影響。</p>
